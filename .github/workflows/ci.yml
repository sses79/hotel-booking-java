name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Show build environment
        run: ./mvnw --version

      - name: Validate local Docker Compose configuration
        run: docker compose --env-file .env.example -f infra/local/compose.yaml config --quiet

      - name: Validate dependencies and formatting
        run: ./mvnw --batch-mode --no-transfer-progress validate spotless:check

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build and start application containers
        run: docker compose --env-file .env.example -f infra/local/compose.yaml up --build --detach --wait

      - name: Smoke-test containerized API
        run: ./scripts/smoke-test-api.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f infra/local/compose.yaml logs

      - name: Stop application containers
        if: always()
        run: docker compose --env-file .env.example -f infra/local/compose.yaml down --volumes
