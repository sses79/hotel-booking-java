name: Native image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: native-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build-smoke-publish:
    name: Build, smoke-test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build Linux AMD64 native image
        run: >
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -Pnative
          -DskipTests
          spring-boot:build-image
          -Dspring-boot.build-image.imageName=${IMAGE_NAME}

      - name: Verify native image architecture and runtime
        run: |
          test "$(docker image inspect "$IMAGE_NAME" --format '{{.Architecture}}')" = "amd64"
          test -z "$(docker image inspect "$IMAGE_NAME" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^JAVA_HOME=' || true)"
          if docker run --rm --entrypoint java "$IMAGE_NAME" -version; then
            echo "Native runtime image unexpectedly contains Java" >&2
            exit 1
          fi

      - name: Start native API and SQL Server
        env:
          NATIVE_IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: >
          docker compose
          --env-file .env.example
          -f infra/local/compose.yaml
          --profile native
          up --detach
          sql sql-init app-native

      - name: Smoke-test native API
        env:
          BASE_URL: http://localhost:8081
        run: ./scripts/smoke-test-api.sh

      - name: Show native container logs on failure
        if: failure()
        run: >
          docker compose
          --env-file .env.example
          -f infra/local/compose.yaml
          --profile native
          logs

      - name: Stop native application containers
        if: always()
        run: >
          docker compose
          --env-file .env.example
          -f infra/local/compose.yaml
          --profile native
          down --volumes

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish immutable native image
        if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE_NAME"
