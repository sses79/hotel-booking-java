name: hotel-booking-java

services:
  app:
    image: hotel-booking-java:local
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: sql
      DB_PORT: 1433
      DB_NAME: HotelBooking
      DB_USER: sa
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      sql-init:
        condition: service_completed_successfully
    networks:
      - hotel-booking

  app-native:
    image: ${NATIVE_IMAGE_NAME:-hotel-booking-java:native}
    profiles:
      - native
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: sql
      DB_PORT: 1433
      DB_NAME: HotelBooking
      DB_USER: sa
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "8081:8080"
    depends_on:
      sql-init:
        condition: service_completed_successfully
    networks:
      - hotel-booking

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      HOME: /var/opt/mssql
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    working_dir: /var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - hotel-booking

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd
        -S sql
        -U sa
        -P "$${MSSQL_SA_PASSWORD}"
        -C
        -b
        -Q "IF DB_ID(N'HotelBooking') IS NULL CREATE DATABASE [HotelBooking]"
    depends_on:
      sql:
        condition: service_healthy
    networks:
      - hotel-booking

networks:
  hotel-booking:

volumes:
  sql-data:
